<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-dark: #0f172a; --glass-bg: rgba(30, 41, 59, 0.7); --primary: #6366f1; --text-main: #f8fafc; }
        body { background: var(--bg-dark); color: var(--text-main); font-family: 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem; }
        .auth-card { background: var(--glass-bg); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; padding: 2rem; width: 100%; max-width: 400px; }
        h2 { text-align: center; margin-bottom: 1.5rem; }
        input { width: 100%; padding: 12px; margin-bottom: 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: white; border-radius: 8px; }
        .btn { width: 100%; padding: 12px; background: var(--primary); color: white; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; }
        .btn:hover { background: #4f46e5; }
        .hidden { display: none; }
        .alert { padding: 10px; margin-bottom: 10px; border-radius: 5px; display: none; text-align: center; }
        .alert-success { background: rgba(16, 185, 129, 0.2); color: #10b981; }
        .alert-error { background: rgba(239, 68, 68, 0.2); color: #ef4444; }
    </style>
</head>
<body>

<div class="auth-card">
    <div id="step1">
        <h2>Reset Password</h2>
        <div id="alert1" class="alert"></div>
        <p style="color:#cbd5e1; margin-bottom:1rem; text-align:center;">Enter your email to receive an OTP.</p>
        <input type="email" id="resetEmail" placeholder="Enter your email">
        <button class="btn" onclick="sendOtp()">Send OTP</button>
    </div>

    <div id="step2" class="hidden">
        <h2>Verify OTP</h2>
        <div id="alert2" class="alert"></div>
        <p style="color:#cbd5e1; margin-bottom:1rem; text-align:center;">Check your email for the code.</p>
        <input type="text" id="otpInput" placeholder="Enter 6-digit OTP">
        <input type="password" id="newPassword" placeholder="New Password">
        <button class="btn" onclick="resetPassword()">Reset Password</button>
    </div>
</div>

<script>
    let userEmail = "";

    async function sendOtp() {
        const email = document.getElementById('resetEmail').value;
        const alertBox = document.getElementById('alert1');
        
        if(!email) return;
        
        const btn = document.querySelector('#step1 button');
        btn.textContent = "Sending...";
        btn.disabled = true;

        try {
            const res = await fetch('/api/send-otp', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email })
            });
            const data = await res.json();

            if(data.success) {
                userEmail = email;
                document.getElementById('step1').classList.add('hidden');
                document.getElementById('step2').classList.remove('hidden');
            } else {
                showAlert('alert1', 'error', data.message);
            }
        } catch(e) {
            showAlert('alert1', 'error', 'Failed to send. Check connection.');
        } finally {
            btn.textContent = "Send OTP";
            btn.disabled = false;
        }
    }

    async function resetPassword() {
        const otp = document.getElementById('otpInput').value;
        const newPassword = document.getElementById('newPassword').value;
        const btn = document.querySelector('#step2 button');

        if(!otp || !newPassword) {
            showAlert('alert2', 'error', 'All fields required');
            return;
        }

        btn.textContent = "Processing...";
        btn.disabled = true;

        try {
            const res = await fetch('/api/reset-password', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: userEmail, otp, new_password: newPassword })
            });
            const data = await res.json();

            if(data.success) {
                showAlert('alert2', 'success', 'Password reset! Redirecting...');
                setTimeout(() => window.location.href = '/login', 2000);
            } else {
                showAlert('alert2', 'error', data.message);
            }
        } catch(e) {
            showAlert('alert2', 'error', 'Error resetting password');
        } finally {
            btn.textContent = "Reset Password";
            btn.disabled = false;
        }
    }

    function showAlert(elementId, type, msg) {
        const el = document.getElementById(elementId);
        el.textContent = msg;
        el.className = `alert alert-${type}`;
        el.style.display = 'block';
    }
</script>

</body>
</html>
