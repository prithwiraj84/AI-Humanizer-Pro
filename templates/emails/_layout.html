<!DOCTYPE html>
<html lang="en">
<body style="margin:0;padding:0;background:#FAF9F6;font-family:-apple-system,'Segoe UI',Helvetica,Arial,sans-serif;color:#16171B;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FAF9F6;padding:32px 16px;">
  <tr><td align="center">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:560px;background:#FFFFFF;border:1px solid #E8E5DE;border-radius:14px;">
      <tr><td style="padding:28px 32px 4px;font-size:15px;font-weight:700;">
        <span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:#F0542C;margin-right:8px;"></span>{{ business_name }}
      </td></tr>
      <tr><td style="padding:12px 32px 30px;font-size:15px;line-height:1.6;color:#4B4E57;">
        {% block content %}{% endblock %}
      </td></tr>
    </table>
    <p style="max-width:560px;margin:18px auto 0;font-size:12px;line-height:1.5;color:#8B8E97;">
      You're receiving this because of activity on your {{ business_name }} account. {% block footer %}{% endblock %}
    </p>
  </td></tr>
</table>
</body>
</html>
