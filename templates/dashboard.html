<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - AI Humanizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass-bg: rgba(30, 41, 59, 0.7);
            --primary: #6366f1;
            --text-main: #f8fafc;
            --text-secondary: #cbd5e1;
            --success: #10b981;
            --danger: #ef4444;
            --accent: #06b6d4;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            padding: 2rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 3rem;
            padding-bottom: 2rem;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .navbar h1 {
            font-size: 1.8rem;
            font-weight: 700;
            color: var(--text-main);
        }

        .nav-links {
            display: flex;
            gap: 1rem;
            align-items: center;
        }

        .btn {
            padding: 10px 20px;
            border-radius: 8px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            transition: all 0.3s ease;
            font-family: 'Space Grotesk', sans-serif;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
        }

        .btn-primary:hover {
            background: #4f46e5;
            transform: translateY(-2px);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.05);
            border-color: var(--primary);
            color: var(--primary);
        }

        .btn-danger {
            background: var(--danger);
            color: white;
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .btn-danger:hover {
            background: #dc2626;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 0.85rem;
        }

        .glass-panel {
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.5rem;
            margin-bottom: 2rem;
            backdrop-filter: blur(10px);
        }

        .glass-panel h2 {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .stat-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .stat-box {
            text-align: center;
        }

        .stat-num {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.95rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 1rem;
        }

        th,
        td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        th {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.2);
        }

        tr:hover {
            background: rgba(99, 102, 241, 0.05);
        }

        .secret-key {
            font-family: 'Monaco', 'Courier New', monospace;
            background: rgba(0, 0, 0, 0.3);
            padding: 4px 8px;
            border-radius: 4px;
            color: var(--success);
            font-size: 0.85rem;
        }

        .empty-state {
            text-align: center;
            padding: 2rem;
            color: var(--text-secondary);
        }

        .empty-icon {
            font-size: 3rem;
            margin-bottom: 1rem;
            opacity: 0.5;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: var(--bg-dark);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 2rem;
            max-width: 500px;
            width: 90%;
        }

        .modal-header {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 1.5rem;
            color: var(--text-main);
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--text-secondary);
            font-weight: 600;
            font-size: 0.9rem;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: var(--text-main);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
        }

        input:focus {
            outline: none;
            border-color: var(--primary);
            background: rgba(99, 102, 241, 0.1);
            box-shadow: 0 0 20px rgba(99, 102, 241, 0.3);
        }

        .modal-footer {
            display: flex;
            gap: 1rem;
            margin-top: 1.5rem;
        }

        .modal-footer .btn {
            flex: 1;
        }

        .copy-btn {
            padding: 6px 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: var(--text-secondary);
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.3s ease;
            font-family: 'Space Grotesk', sans-serif;
        }

        .copy-btn:hover {
            background: var(--primary);
            border-color: var(--primary);
            color: white;
        }

        .alert {
            padding: 1rem;
            background: rgba(16, 185, 129, 0.2);
            border: 1px solid var(--success);
            border-radius: 8px;
            margin-bottom: 1rem;
            color: var(--success);
            display: none;
        }

        .alert.show {
            display: block;
        }

        .alert-warning {
            background: rgba(245, 158, 11, 0.2);
            border-color: #f59e0b;
            color: #f59e0b;
        }

        @media (max-width: 768px) {
            .navbar {
                flex-direction: column;
                gap: 1rem;
            }

            .stat-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="navbar">
            <h1><i class="fa-solid fa-robot"></i> AI Humanizer</h1>
            <div class="nav-links">
                <a href="/" class="btn btn-secondary">Home</a>
                <a href="/docs" class="btn btn-secondary">Docs</a>
                <button onclick="logout()" class="btn btn-primary">Logout</button>
            </div>
        </div>

        <div id="alertBox"></div>

        <!-- Stats -->
        <div class="stat-grid">
            <div class="glass-panel stat-box">
                <div class="stat-num" id="totalRequests">0</div>
                <div class="stat-label">Total Requests</div>
            </div>
            <div class="glass-panel stat-box">
                <div class="stat-num" id="successRate">0%</div>
                <div class="stat-label">Success Rate</div>
            </div>
            <div class="glass-panel stat-box">
                <div class="stat-num" id="avgLatency">0ms</div>
                <div class="stat-label">Avg Latency</div>
            </div>
            <div class="glass-panel stat-box">
                <div class="stat-num" id="keyCount">0</div>
                <div class="stat-label">API Keys</div>
            </div>
        </div>

        <!-- API Keys Section -->
        <div class="glass-panel">
            <h2>
                <span><i class="fa-solid fa-key"></i> API Keys</span>
                <button class="btn btn-primary btn-sm" onclick="openCreateKeyModal()">+ Create New Key</button>
            </h2>
            <div id="keysContainer">
                <div class="empty-state">
                    <div class="empty-icon">🔑</div>
                    <div>No API Keys Yet</div>
                </div>
            </div>
        </div>

        <!-- Usage Logs Section -->
        <div class="glass-panel">
            <h2><i class="fa-solid fa-chart-line"></i> Recent Activity</h2>
            <div id="logsContainer">
                <div class="empty-state">
                    <div class="empty-icon">📊</div>
                    <div>No Activity Yet</div>
                </div>
            </div>
        </div>
    </div>

    <!-- Create Key Modal -->
    <div id="createKeyModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">Create API Key</div>
            <div class="form-group">
                <label for="keyName">Key Name</label>
                <input type="text" id="keyName" placeholder="My App" required>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeCreateKeyModal()">Cancel</button>
                <button class="btn btn-primary" onclick="createApiKey()">Create</button>
            </div>
        </div>
    </div>

    <!-- Key Created Modal -->
    <div id="keyCreatedModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">✅ API Key Created</div>
            <div class="alert alert-warning">
                ⚠️ Save your secret securely. It won't be shown again!
            </div>
            <div class="form-group">
                <label>API Key</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="displayApiKey" readonly style="flex: 1;">
                    <button class="copy-btn" onclick="copyToClipboard('displayApiKey')">Copy</button>
                </div>
            </div>
            <div class="form-group">
                <label>Secret (Save this!)</label>
                <div style="display: flex; gap: 10px;">
                    <input type="text" id="displaySecret" readonly style="flex: 1;">
                    <button class="copy-btn" onclick="copyToClipboard('displaySecret')">Copy</button>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-primary" onclick="closeKeyCreatedModal()" style="flex: 1;">Got It</button>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            checkAuth();
            loadStats();
            loadApiKeys();
        });

        async function checkAuth() {
            try {
                const response = await fetch('/auth/check');
                const data = await response.json();
                if (!data.authenticated) {
                    window.location.href = '/login';
                }
            } catch {
                window.location.href = '/login';
            }
        }

        async function loadStats() {
            try {
                const response = await fetch('/api/usage');
                const data = await response.json();
                const stats = data.stats;

                document.getElementById('totalRequests').textContent = stats.total_requests;
                document.getElementById('successRate').textContent = stats.success_rate;
                document.getElementById('avgLatency').textContent = stats.avg_latency_ms + 'ms';

                renderLogs(data.logs);
            } catch (error) {
                console.error('Error loading stats:', error);
            }
        }

        async function loadApiKeys() {
            try {
                const response = await fetch('/api/keys');
                const data = await response.json();
                const keys = data.keys;

                document.getElementById('keyCount').textContent = keys.length;
                renderKeys(keys);
            } catch (error) {
                console.error('Error loading keys:', error);
            }
        }

        function renderKeys(keys) {
            const container = document.getElementById('keysContainer');

            if (keys.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">🔑</div><div>No API Keys Yet</div></div>`;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Key Name</th>
                            <th>API Key</th>
                            <th>Created</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            keys.forEach(key => {
                html += `
                    <tr>
                        <td>${key.name}</td>
                        <td><span class="secret-key">${key.api_key}</span></td>
                        <td>${key.created_at}</td>
                        <td><button class="btn btn-danger btn-sm" onclick="deleteKey('${key.id}')">Delete</button></td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function renderLogs(logs) {
            const container = document.getElementById('logsContainer');

            if (logs.length === 0) {
                container.innerHTML = `<div class="empty-state"><div class="empty-icon">📊</div><div>No Activity Yet</div></div>`;
                return;
            }

            let html = `
                <table>
                    <thead>
                        <tr>
                            <th>Timestamp</th>
                            <th>Endpoint</th>
                            <th>Status</th>
                            <th>Latency</th>
                        </tr>
                    </thead>
                    <tbody>
            `;

            logs.slice().reverse().forEach(log => {
                const time = new Date(log.timestamp).toLocaleTimeString();
                const statusColor = log.status_code < 400 ? 'var(--success)' : 'var(--danger)';
                html += `
                    <tr>
                        <td>${time}</td>
                        <td>${log.endpoint}</td>
                        <td style="color: ${statusColor};">${log.status_code}</td>
                        <td>${log.latency_ms}ms</td>
                    </tr>
                `;
            });

            html += `</tbody></table>`;
            container.innerHTML = html;
        }

        function openCreateKeyModal() {
            document.getElementById('createKeyModal').classList.add('active');
        }

        function closeCreateKeyModal() {
            document.getElementById('createKeyModal').classList.remove('active');
            document.getElementById('keyName').value = '';
        }

        async function createApiKey() {
            const name = document.getElementById('keyName').value.trim();

            if (!name) {
                showAlert('Please enter a key name', 'error');
                return;
            }

            try {
                const response = await fetch('/api/keys', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name })
                });

                const data = await response.json();

                if (response.ok) {
                    closeCreateKeyModal();
                    document.getElementById('displayApiKey').value = data.key.api_key;
                    document.getElementById('displaySecret').value = data.key.secret;
                    document.getElementById('keyCreatedModal').classList.add('active');
                    loadApiKeys();
                } else {
                    showAlert(data.error || 'Error creating key', 'error');
                }
            } catch (error) {
                showAlert('Error creating key', 'error');
            }
        }

        function closeKeyCreatedModal() {
            document.getElementById('keyCreatedModal').classList.remove('active');
        }

        async function deleteKey(keyId) {
            if (!confirm('Are you sure you want to delete this API key?')) return;

            try {
                const response = await fetch(`/api/keys/${keyId}`, { method: 'DELETE' });
                if (response.ok) {
                    loadApiKeys();
                    showAlert('Key deleted successfully', 'success');
                } else {
                    showAlert('Error deleting key', 'error');
                }
            } catch (error) {
                showAlert('Error deleting key', 'error');
            }
        }

        function copyToClipboard(elementId) {
            const element = document.getElementById(elementId);
            element.select();
            document.execCommand('copy');

            const btn = event.target;
            btn.textContent = '✓ Copied';
            setTimeout(() => { btn.textContent = 'Copy'; }, 2000);
        }

        function showAlert(message, type) {
            const alertBox = document.getElementById('alertBox');
            alertBox.innerHTML = `<div class="alert ${type === 'error' ? '' : ''}" style="background: ${type === 'error' ? 'rgba(239, 68, 68, 0.2); border-color: var(--danger); color: var(--danger)' : 'rgba(16, 185, 129, 0.2); border-color: var(--success); color: var(--success)'};">${message}</div>`;
            setTimeout(() => { alertBox.innerHTML = ''; }, 5000);
        }

        async function logout() {
            await fetch('/auth/logout', { method: 'POST' });
            window.location.href = '/login';
        }

        setInterval(loadStats, 30000);
    </script>
</body>
</html>
