<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - AI Humanizer</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-base: #060b16;
            --panel-bg: rgba(12, 20, 37, 0.78);
            --panel-border: rgba(255, 255, 255, 0.12);
            --text-main: #f8fafc;
            --text-subtle: #a7b4ce;
            --primary: #14b8a6;
            --primary-deep: #0f766e;
            --danger: #ef4444;
            --ok: #22c55e;
            --glow: rgba(20, 184, 166, 0.35);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            font-family: 'Space Grotesk', sans-serif;
            color: var(--text-main);
            background:
                radial-gradient(circle at 15% 25%, rgba(20, 184, 166, 0.20), transparent 42%),
                radial-gradient(circle at 85% 80%, rgba(59, 130, 246, 0.24), transparent 48%),
                linear-gradient(145deg, #030712 0%, #0a1226 55%, #101b34 100%);
        }

        .card {
            width: 100%;
            max-width: 460px;
            border: 1px solid var(--panel-border);
            border-radius: 18px;
            background: var(--panel-bg);
            backdrop-filter: blur(12px);
            box-shadow: 0 18px 60px rgba(0, 0, 0, 0.45);
            padding: 2.2rem;
            animation: cardIn 0.6s ease;
        }

        .badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.45rem 0.75rem;
            border-radius: 999px;
            background: rgba(20, 184, 166, 0.15);
            border: 1px solid rgba(20, 184, 166, 0.35);
            color: #5eead4;
            font-weight: 600;
            font-size: 0.85rem;
            margin-bottom: 1rem;
        }

        h1 {
            font-size: 2rem;
            margin-bottom: 0.4rem;
            letter-spacing: -0.3px;
        }

        .subtitle {
            color: var(--text-subtle);
            margin-bottom: 1.8rem;
        }

        .alert {
            display: none;
            padding: 0.85rem 1rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .alert.error {
            display: block;
            color: #fecaca;
            border: 1px solid rgba(239, 68, 68, 0.45);
            background: rgba(239, 68, 68, 0.2);
        }

        .alert.success {
            display: block;
            color: #bbf7d0;
            border: 1px solid rgba(34, 197, 94, 0.45);
            background: rgba(34, 197, 94, 0.2);
        }

        .field {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-size: 0.9rem;
            color: var(--text-subtle);
            margin-bottom: 0.5rem;
            font-weight: 600;
        }

        .input-wrap {
            position: relative;
        }

        .input-wrap i.left {
            position: absolute;
            left: 0.9rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-subtle);
        }

        .toggle {
            position: absolute;
            right: 0.85rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-subtle);
            cursor: pointer;
        }

        input {
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.16);
            border-radius: 12px;
            background: rgba(2, 6, 23, 0.55);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.98rem;
            padding: 0.95rem 2.8rem 0.95rem 2.75rem;
            outline: none;
            transition: 0.2s;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px var(--glow);
        }

        .btn {
            width: 100%;
            border: none;
            border-radius: 12px;
            padding: 0.95rem 1rem;
            font-size: 1rem;
            font-weight: 700;
            font-family: inherit;
            color: #ecfeff;
            background: linear-gradient(140deg, var(--primary), var(--primary-deep));
            cursor: pointer;
            box-shadow: 0 0 22px var(--glow);
            transition: transform 0.2s ease, box-shadow 0.2s ease, opacity 0.2s ease;
        }

        .btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 0 28px rgba(20, 184, 166, 0.48);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .meta {
            margin-top: 1.1rem;
            font-size: 0.85rem;
            color: var(--text-subtle);
            line-height: 1.45;
        }

        .meta strong {
            color: #5eead4;
        }

        .links {
            margin-top: 1.3rem;
            text-align: center;
            font-size: 0.9rem;
            color: var(--text-subtle);
        }

        .links a {
            color: #5eead4;
            text-decoration: none;
            font-weight: 600;
        }

        .links a:hover {
            text-decoration: underline;
        }

        .spin {
            animation: spin 1s linear infinite;
            display: inline-block;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        @keyframes cardIn {
            from {
                opacity: 0;
                transform: translateY(12px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 520px) {
            body {
                padding: 1rem;
            }

            .card {
                padding: 1.5rem;
            }

            h1 {
                font-size: 1.65rem;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="badge">
            <i class="fa-solid fa-shield-halved"></i>
            Secure Admin Access
        </div>
        <h1>Admin Console Login</h1>
        <p class="subtitle">Sign in to monitor users, API keys, and usage activity.</p>

        <div id="alertBox" class="alert"></div>

        <form id="adminLoginForm">
            <div class="field">
                <label for="email">Admin Email</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-envelope left"></i>
                    <input id="email" type="email" placeholder="admin@aih.local" required>
                </div>
            </div>

            <div class="field">
                <label for="password">Admin Password</label>
                <div class="input-wrap">
                    <i class="fa-solid fa-lock left"></i>
                    <input id="password" type="password" placeholder="Enter admin password" required>
                    <i id="togglePassword" class="fa-solid fa-eye toggle"></i>
                </div>
            </div>

            <button id="submitBtn" type="submit" class="btn">
                <i class="fa-solid fa-right-to-bracket"></i>
                Login as Admin
            </button>
        </form>

        <p class="meta">
            Tip: Set <strong>ADMIN_EMAIL</strong> and <strong>ADMIN_PASSWORD</strong> environment variables to change default admin credentials.
        </p>

        <div class="links">
            Need user login instead? <a href="/login">Go to User Login</a>
        </div>
    </div>

    <script>
        var form = document.getElementById('adminLoginForm');
        var submitBtn = document.getElementById('submitBtn');
        var alertBox = document.getElementById('alertBox');
        var togglePassword = document.getElementById('togglePassword');

        togglePassword.addEventListener('click', function () {
            var input = document.getElementById('password');
            if (input.type === 'password') {
                input.type = 'text';
                togglePassword.classList.remove('fa-eye');
                togglePassword.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                togglePassword.classList.remove('fa-eye-slash');
                togglePassword.classList.add('fa-eye');
            }
        });

        form.addEventListener('submit', async function (event) {
            event.preventDefault();

            var email = document.getElementById('email').value.trim();
            var password = document.getElementById('password').value;

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<span class="spin"><i class="fa-solid fa-spinner"></i></span> Verifying...';

            try {
                var response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });

                var result = await response.json();

                if (response.ok && result.success) {
                    showAlert('success', 'Admin login successful. Redirecting...');
                    setTimeout(function () {
                        window.location.href = '/admin';
                    }, 700);
                    return;
                }

                showAlert('error', result.message || 'Invalid admin credentials.');
            } catch (err) {
                showAlert('error', 'Unable to connect to the server. Try again.');
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login as Admin';
            }
        });

        function showAlert(type, message) {
            alertBox.className = 'alert ' + type;
            alertBox.textContent = message;
        }
    </script>
</body>
</html>
