# Render blueprint — ONE web service serving the website + API together.
# Build via the Dockerfile (Node builds the Next.js export, Python serves it
# alongside the FastAPI API). Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: ai-humanizer
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: SECRET_KEY
        generateValue: true        # Render generates a stable random value
      - key: ADMIN_EMAIL
        sync: false                # set real values in the dashboard
      - key: ADMIN_PASSWORD
        sync: false
      - key: SENDER_EMAIL
        sync: false
      - key: SENDER_PASSWORD
        sync: false
      - key: SMTP_SERVER
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
